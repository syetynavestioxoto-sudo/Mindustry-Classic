# Builds Mindustry Classic for the iPad mini 1st gen (A5 / armv7).
#
# Xcode situation (Sep 2026): GitHub-hosted macOS runners ship macOS 14/15/26
# with Xcode 15/16+ only. Apple removed armv7 in Xcode 10 and the minimum
# deployment target is iOS 12, so NO macOS runner can emit armv7 / iOS 8
# binaries - not even via RoboVM (it shells out to the active Xcode's
# xcrun/lipo/codesign). The 32-bit link therefore runs on ubuntu-22.04 with
# clang + cctools-port (Apple ld64) + theos SDK + MinimumOSVersion 8.0.
# Output is an UNSIGNED Mach-O + IPA skeleton for jailbroken install
# (AppSync / `ldid -S` on device).

name: ios-arm32

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-libs:
    name: Java jars (JDK8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Drop dead modules (html/gwt on jcenter, android SDK)
        run: |
          python3 - <<'EOF'
          # settings: keep modules that build with plain JDK8 + Maven Central
          open('settings.gradle', 'w').write(
              "include 'desktop', 'core', 'kryonet', 'server', 'ios'\n")
          lines = open('build.gradle').read().splitlines(keepends=True)
          out, skip, depth = [], False, 0
          for ln in lines:
              s = ln.strip()
              if not skip and "gwt-gradle-plugin" in ln:
                  continue  # artifact only existed on dead jcenter
              if not skip and (s == 'project(":html") {' or s == 'project(":android") {'):
                  skip, depth = True, 1
                  continue
              if skip:
                  depth += ln.count('{') - ln.count('}')
                  if depth <= 0 and s == '}':
                      skip = False
                  continue
              out.append(ln)
          open('build.gradle', 'w').write(''.join(out))
          EOF
          cat settings.gradle
      - name: Compile game jars
        run: ./gradlew --no-daemon :core:compileJava :kryonet:compileJava :desktop:compileJava :server:compileJava :ios:compileJava
      - name: Package jars
        run: ./gradlew --no-daemon :core:jar :kryonet:jar :server:jar
      - uses: actions/upload-artifact@v4
        with:
          name: classic-jars
          path: |
            core/build/libs/*.jar
            kryonet/build/libs/*.jar
            server/build/libs/*.jar

  ios-executable:
    name: armv7 Mach-O + unsigned IPA
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm autoconf automake libtool \
            pkg-config cmake python3 uuid-dev libssl-dev libxml2-dev zlib1g-dev \
            libdispatch-dev libblocksruntime-dev file zip
      - name: Fetch iOS SDK (theos, tbd-v2, has armv7)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS10.3.sdk
          grep -m1 'tapi-tbd' /tmp/sdks/iPhoneOS10.3.sdk/usr/lib/libSystem.tbd
          grep -m1 'armv7' /tmp/sdks/iPhoneOS10.3.sdk/usr/lib/libSystem.tbd
      - name: Build Apple linker (cctools-port + libtapi)
        run: |
          git clone --depth 1 https://github.com/tpoechtrager/apple-libtapi.git /tmp/tapi
          (cd /tmp/tapi && ./build.sh && sudo ./install.sh)
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git /tmp/ct
          python3 tools/ios-arm32/fix_dispatch.py /tmp/ct
          cd /tmp/ct/cctools
          ./configure --prefix=/opt/cctools --with-libtapi=/usr/local \
            --target=arm-apple-darwin11
          make -j$(nproc)
          sudo make install
          /opt/cctools/bin/arm-apple-darwin11-ld -v
      - name: Compile armv7 objects (min iOS 8.0)
        run: |
          export SDK=/tmp/sdks/iPhoneOS10.3.sdk
          mkdir -p out
          clang -target armv7-apple-ios -miphoneos-version-min=8.0 \
            -isysroot $SDK -c tools/ios-arm32/hello.c -o out/hello.o
          clang -target armv7-apple-ios -miphoneos-version-min=8.0 \
            -isysroot $SDK -fobjc-arc -c tools/ios-arm32/main.m -o out/main.o
          file out/hello.o out/main.o | tee out/objects.txt
          grep -q "Mach-O armv7 object" out/objects.txt
      - name: Link armv7 executables (Apple ld64)
        run: |
          export SDK=/tmp/sdks/iPhoneOS10.3.sdk
          export LD=/opt/cctools/bin/arm-apple-darwin11-ld
          $LD -arch armv7 -platform_version ios 8.0 10.3 -syslibroot $SDK \
            -o out/hello out/hello.o -lSystem
          $LD -arch armv7 -platform_version ios 8.0 10.3 -syslibroot $SDK \
            -o out/Classic8 out/main.o \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -lobjc -lSystem
          file out/hello out/Classic8 | tee out/binaries.txt
          grep -q "Mach-O.*armv7" out/binaries.txt
      - name: Assemble unsigned IPA skeleton
        run: |
          mkdir -p Payload/Classic8.app
          cp out/Classic8 Payload/Classic8.app/
          cp tools/ios-arm32/Info.plist Payload/Classic8.app/
          cp ios/Info.plist.xml Payload/Classic8.app/Info-robovm-orig.plist
          zip -r out/Classic8-armv7-unsigned.ipa Payload
          ls -lh out/
          echo "NOTE: unsigned - install with AppSync or run 'ldid -S Classic8' on device" | tee out/SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: classic-ios-armv7
          path: out/
